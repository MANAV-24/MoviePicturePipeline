apiVersion: apps/v1
kind: Deployment
metadata:
  name: moviepicture-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: moviepicture-backend
  template:
    metadata:
      labels:
        app: moviepicture-backend
    spec:
      containers:
        - name: backend
          image: backend:latest
          ports:
            - containerPort: 5000